apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: completeagent-default
  namespace: completeagent
spec:
  podSelector:
    matchLabels:
      app: completeagent
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              ingress: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS (LLM providers, OIDC, etc.)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    # Internal cluster services (Redis, Qdrant, OTel)
    - to:
        - podSelector:
            matchLabels:
              app: redis
        - podSelector:
            matchLabels:
              app: qdrant
        - podSelector:
            matchLabels:
              app: otel-collector
