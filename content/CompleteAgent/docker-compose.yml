services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: completeagent:dev
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      COMPLETEAGENT_Agent__Provider: OpenAI
      COMPLETEAGENT_Agent__OpenAI__ApiKey: ${OPENAI_API_KEY}
      COMPLETEAGENT_Authentication__ApiKey: ${API_KEY}
      COMPLETEAGENT_RateLimit__Store: Redis
      COMPLETEAGENT_RateLimit__RedisConnectionString: redis:6379
      COMPLETEAGENT_Persistence__ConversationStore: Sqlite
      COMPLETEAGENT_Persistence__ConnectionString: "Data Source=/data/agent.db"
      COMPLETEAGENT_Retrieval__VectorStore: Qdrant
      COMPLETEAGENT_Retrieval__Qdrant__Host: qdrant
      COMPLETEAGENT_Telemetry__OtlpEndpoint: http://otel:4317
    volumes:
      - agent-data:/data
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  agent-data:
  qdrant-data:
