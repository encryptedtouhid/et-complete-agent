services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: completeagent:dev
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      COMPLETEAGENT_Agent__Provider: OpenAI
      COMPLETEAGENT_Agent__OpenAI__ApiKey: ${OPENAI_API_KEY}
      COMPLETEAGENT_Authentication__ApiKey: ${API_KEY}
      COMPLETEAGENT_RateLimit__Store: Redis
      COMPLETEAGENT_RateLimit__RedisConnectionString: redis:6379
      COMPLETEAGENT_Persistence__ConversationStore: Sqlite
      COMPLETEAGENT_Persistence__ConnectionString: "Data Source=/data/agent.db"
      COMPLETEAGENT_Retrieval__VectorStore: Qdrant
      COMPLETEAGENT_Retrieval__Qdrant__Host: qdrant
      COMPLETEAGENT_Telemetry__OtlpEndpoint: http://aspire-dashboard:18889
      COMPLETEAGENT_Telemetry__EnableConsoleExporter: "false"
    volumes:
      - agent-data:/data
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      aspire-dashboard:
        condition: service_started

  # Observability UI — traces, metrics, structured logs at http://localhost:18888
  # First-party Microsoft Aspire Dashboard, OTLP-native, zero config.
  # For production swap to Grafana + Tempo, Application Insights, Honeycomb, etc.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.4
    ports:
      - "18888:18888"   # Web UI
      - "18889:18889"   # OTLP gRPC receiver
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: "http://0.0.0.0:18889"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  agent-data:
  qdrant-data:
