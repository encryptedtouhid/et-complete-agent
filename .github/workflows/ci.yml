name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pack-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack template
        run: dotnet pack -c Release -o ./artifacts

      - name: Install template from local nupkg
        run: dotnet new install ./artifacts/ET.AgentFramework.Templates.0.1.0.nupkg

      - name: Generate sample project
        run: dotnet new et-complete-agent -n SmokeTest -o /tmp/SmokeTest

      - name: Restore generated project
        working-directory: /tmp/SmokeTest
        run: dotnet restore

      - name: Build generated project
        working-directory: /tmp/SmokeTest
        run: dotnet build --no-restore -c Release

      - name: Test generated project
        working-directory: /tmp/SmokeTest
        run: dotnet test --no-build -c Release
