name: Feature request
description: Suggest a new capability for the template
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? What workaround are you using?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you imagine this working? Specify configuration shape if it adds settings.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: scope
    attributes:
      label: Which layer would change?
      multiple: true
      options:
        - Domain
        - Application
        - Infrastructure
        - Host (HTTP / middleware)
        - Deploy (Docker / Kubernetes)
        - Tests
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: license
    attributes:
      label: License constraint
      options:
        - label: "I confirm any new dependency I'm proposing is MIT or Apache 2.0"
          required: true
