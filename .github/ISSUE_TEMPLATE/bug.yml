name: Bug report
description: Something is broken in the template or in a generated project
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Please do not include API keys, JWTs, or
        connection strings in this issue.** Redact them with `[redacted]`.

  - type: input
    id: template-version
    attributes:
      label: Template version
      description: From `dotnet new et-complete-agent --list` or your `csproj`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET SDK version
      description: Output of `dotnet --version`.
      placeholder: "10.0.300"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: LLM provider
      options:
        - Azure OpenAI
        - OpenAI
        - Other / N/A
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal steps. Include the exact `dotnet new` command and the request that triggers the bug.
      placeholder: |
        1. dotnet new et-complete-agent -n Demo
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / traces
      description: Redact secrets. Attach an OpenTelemetry trace ID if available.
      render: text
